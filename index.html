<script>
const DB="myHealthSimple",VER=3,STORES=["healthEvents","settings"];
let dbp;
function openDB(){
  if(dbp)return dbp;
  dbp=new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB,VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      // Keep only the stores used by the current simple health app.
      ["medications","medicationLogs","supplements","supplementLogs"].forEach(s=>{
        if(d.objectStoreNames.contains(s)) d.deleteObjectStore(s);
      });
      STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})});
    };
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
    r.onblocked=()=>console.warn("IndexedDB upgrade is blocked by another tab");
  });
  return dbp;
}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
async function put(s,v){const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction(s,"readwrite");t.objectStore(s).put(v);t.oncomplete=()=>{ok();if(typeof driveMarkLocalChange==='function')driveMarkLocalChange()};t.onerror=()=>no(t.error)})}
async function all(s){const d=await openDB();if(!d.objectStoreNames.contains(s))return [];return new Promise((ok,no)=>{const r=d.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function del(s,id){const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction(s,"readwrite");t.objectStore(s).delete(id);t.oncomplete=()=>{ok();if(typeof driveMarkLocalChange==='function')driveMarkLocalChange()};t.onerror=()=>no(t.error)})}
function today(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
async function exportData(){const o={version:3,exportedAt:new Date().toISOString()};for(const s of STORES)o[s]=await all(s);const b=new Blob([JSON.stringify(o,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`my-health-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){const x=JSON.parse(await file.text());for(const s of STORES)for(const v of x[s]||[])await put(s,v)}
async function getSettings(){const rows=await all("settings");return rows.find(x=>x.id==="preferences")||{id:"preferences",heightCm:null,foodCalories:{}}}
async function saveSettings(patch){const old=await getSettings();const next={...old,...patch,id:"preferences"};await put("settings",next);return next}

</script>
<script>
let page="home",trend="weight";
const titles={home:"首页",record:"记录",trends:"趋势",timeline:"时间轴",me:"设置"};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=d=>new Intl.DateTimeFormat("zh-CN",{month:"short",day:"numeric",weekday:"short"}).format(new Date(d));
function localDate(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function localTime(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getHours())}:${p(d.getMinutes())}`}
function localISO(date,time){return `${date}T${time}:00`}

document.addEventListener("click",async e=>{
 const p=e.target.closest("[data-page]");if(p){page=p.dataset.page;render();return}
 if(e.target.closest("#topAdd")){page="record";render();return}
 if(e.target.closest("[data-close]")){closeModal();return}
 const q=e.target.closest("[data-quick]");if(q){await openRecord(q.dataset.quick);return;}

 const remove=e.target.closest("[data-delete]");if(remove){e.preventDefault();e.stopPropagation();if(confirm("确定删除这条记录吗？")){await del(remove.dataset.store,remove.dataset.delete);render()}return}
 if(e.target.closest("#driveConnect")){await driveConnect();return}
 if(e.target.closest("#driveDisconnect")){driveDisconnect();return}
 if(e.target.closest("#driveUpload")){await driveUpload(true,true);return}
 if(e.target.closest("#driveDownload")){await driveDownload();return}
 if(e.target.closest("#saveBodyParams")){await saveBodyParams();return}
 if(e.target.closest("#manageGoal")){await openGoal();return}
 if(e.target.closest("#saveHeight")){const v=Number(document.getElementById("heightInput").value);if(v>=50&&v<=250){await saveSettings({heightCm:v});render()}return}
 if(e.target.closest("#export"))await exportData();
 if(e.target.closest("#import"))document.getElementById("fileInput").click();
 const tr=e.target.closest("[data-trend]");if(tr){trend=tr.dataset.trend;render()}
});
document.addEventListener("change",async e=>{if(e.target.id==="fileInput"){await importData(e.target.files[0]);render()}});

async function render(){
 document.getElementById("pageTitle").textContent=titles[page];
 document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.page===page));
 const m=document.getElementById("main");
 try {
 if(page==="home")m.innerHTML=await home();
 else if(page==="record")m.innerHTML=recordPage();
 else if(page==="trends")m.innerHTML=await trendsPage();
 else if(page==="timeline")m.innerHTML=await timeline();
 else if(page==="me")m.innerHTML=await me();
} catch(err) {
 console.error(err);
 m.innerHTML=`<div class="empty"><strong>页面加载失败</strong><br><span class="muted">${esc(err.message||"未知错误")}</span><br><button class="btn" style="margin-top:12px" onclick="location.reload()">重新加载</button></div>`;
}
 if(typeof driveBindUI==='function')driveBindUI();
 if(page==="me"&&typeof driveSilentRestore==='function')driveSilentRestore();
}
async function home(){
 const events=(await all("healthEvents")).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
 const w=events.filter(x=>x.type==="weight").sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
 const ex=events.filter(x=>x.type==="exercise").sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
 const diet=events.filter(x=>x.type==="diet"&&x.timestamp.slice(0,10)===today());
 const now=new Date(),monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
 const monthlyExerciseCalories=events.filter(x=>x.type==="exercise"&&x.timestamp.slice(0,7)===monthKey).reduce((sum,x)=>sum+(Number(x.calories)||0),0);
 const settings=await getSettings(),height=settings.heightCm>0?Number(settings.heightCm):null,bmi=w&&height?Number(w.value)/(height/100)**2:null;
 const bmiInfo=(()=>{if(bmi==null||!height)return null;const h=height/100;if(bmi<18.5)return["偏低",`< 18.5 · 体重 < ${(18.5*h*h).toFixed(1)} kg`];if(bmi<25)return["正常",`18.5–24.9 · ${(18.5*h*h).toFixed(1)}–${(25*h*h).toFixed(1)} kg`];if(bmi<30)return["偏高",`25.0–29.9 · ${(25*h*h).toFixed(1)}–${(30*h*h).toFixed(1)} kg`];return["肥胖",`≥ 30.0 · 体重 ≥ ${(30*h*h).toFixed(1)} kg`]})();
 let goalCard="";
 const g=settings.weightLossGoal;
 if(g){
  const cw=Number(w?.value)||Number(g.startWeight),age=ageFromBirthdate(settings.birthDate),bmr=calcBMR(cw,height,age,settings.sex),tdee=bmr?Math.round(bmr*(Number(settings.activityFactor)||1.2)):null,gt=calcGoalTarget(g.startDate,g.endDate,Number(g.startWeight),Number(g.targetWeight)),lost=Math.max(0,Number(g.startWeight)-cw),pct=Math.max(0,Math.min(100,gt.loss?lost/gt.loss*100:0));
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const ydKey=`${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,"0")}-${String(yesterday.getDate()).padStart(2,"0")}`;
  const food=events.filter(x=>x.type==="diet"&&x.timestamp.slice(0,10)===ydKey).reduce((a,x)=>a+(Number(x.totalCalories??((x.calories||0)*(x.quantity||1)))||0),0);
  const yesterdayEx=events.filter(x=>x.type==="exercise"&&x.timestamp.slice(0,10)===ydKey).reduce((a,x)=>a+(Number(x.calories)||0),0);
  const base=tdee!=null?Math.max(0,tdee-gt.dailyDeficit):null,budget=base!=null?base+yesterdayEx:null,gap=tdee!=null?tdee+yesterdayEx-food:null,ok=gap!=null&&gap>=gt.dailyDeficit;
  goalCard=`<div class="section-title"><h3>🎯 减肥目标</h3><button class="link" onclick="openGoal()">管理</button></div><div class="card goal-card"><div class="goal-head"><div><div class="goal-weight">${Number(g.startWeight).toFixed(1)} <span class="goal-arrow">→</span> ${Number(g.targetWeight).toFixed(1)} kg</div><div class="muted">目标日期 ${g.endDate}</div></div><b>${pct.toFixed(0)}%</b></div><div class="progress"><i style="width:${pct.toFixed(1)}%"></i></div><div class="muted">已减 ${lost.toFixed(1)} kg · 还需 ${Math.max(0,cw-Number(g.targetWeight)).toFixed(1)} kg</div><div class="goal-grid"><div class="goal-stat"><span class="muted">目标每日缺口</span><b>${Math.round(gt.dailyDeficit)} kcal</b></div><div class="goal-stat"><span class="muted">昨日饮食预算</span><b>${budget!=null?Math.round(budget):"—"} kcal</b></div><div class="goal-stat"><span class="muted">昨日已吃</span><b>${Math.round(food)} kcal</b></div><div class="goal-stat"><span class="muted">昨日运动</span><b>+${Math.round(yesterdayEx)} kcal</b></div></div><div class="goal-status ${ok?"goal-good":"goal-warn"}">${ok?"🟢 昨日目标达成":"🟡 昨日目标未达成"}${budget!=null?` · 剩余 ${Math.max(0,Math.round(budget-food))} kcal`:""}</div></div>`;
 }
 return `<section class="hero"><div class="date">${new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date())}</div><h2>今天，照顾好自己。</h2><div class="muted">只记录真正有用的健康信息。</div></section>
 ${goalCard}<div class="section-title"><h3>今日概览</h3></div><div class="grid">${metric("⚖️","体重",w?`${w.value} kg`:"—",w?fmt(w.timestamp):"暂无记录")}${metric("🏃","运动",ex?`${ex.duration} min`:"—",ex?ex.activity:"暂无记录")}${metric("📏","BMI",bmi?bmi.toFixed(1):"—",bmiInfo?`${bmiInfo[0]} · ${bmiInfo[1]}`:(height?"暂无体重":"请在设置中输入身高"))}${metric("🔥","本月运动",`${monthlyExerciseCalories} kcal`,`${now.getMonth()+1}月累计消耗`)}</div>
 <div class="section-title"><h3>今日饮食</h3><button class="link" data-page="record">添加</button></div>${diet.map(eventRow).join("")||`<div class="empty">今天还没有饮食记录</div>`}
 <div class="section-title"><h3>最近记录</h3><button class="link" data-page="timeline">全部</button></div>${events.slice(0,4).map(eventRow).join("")||`<div class="empty">还没有记录。点击 ＋ 开始。</div>`}`;

async function driveFindFile(){const q=`name='${DRIVE_FILE_NAME}' and trashed=false`;const r=await driveFetch('https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q,spaces:'drive',fields:'files(id,name,modifiedTime,size)',pageSize:'10'}));const data=await r.json();driveFileId=data.files?.[0]?.id||null;return data.files?.[0]||null}
async function drivePayload(){return{schema:'my-health-sync-v1',appVersion:'3.1',updatedAt:new Date().toISOString(),stores:{healthEvents:await all('healthEvents'),settings:await all('settings')}}}
async function driveUpload(showToast=true,interactive=true){if(driveBusy)return;driveBusy=true;driveSetStatus('正在同步到 Google Drive…');driveProgress(10,'准备数据…');try{await driveGetToken(interactive);driveProgress(25,'查找云端文件…');const existing=await driveFindFile();const payload=await drivePayload(),text=JSON.stringify(payload);driveProgress(45,'上传健康数据…');if(existing){driveFileId=existing.id;await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(driveFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:text,interactive})}else{const boundary='myHealthSyncBoundary'+Date.now(),meta={name:DRIVE_FILE_NAME,mimeType:'application/json'},body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+text+'\r\n--'+boundary+'--';const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body,interactive});const data=await r.json();driveFileId=data.id}localStorage.setItem('myHealth.driveConnected','1');driveProgress(100,'同步完成');driveSetStatus('已同步到 Google Drive · '+new Date().toLocaleString(),'ok');if(showToast)alert('健康数据已同步到 Google Drive')}catch(e){driveProgress(100,'同步失败');driveSetStatus(e.message||String(e),'error');if(showToast)alert('Google Drive 同步失败：'+(e.message||e))}finally{driveBusy=false}}
async function driveDownload(){if(driveBusy)return;driveBusy=true;driveSetStatus('正在从 Google Drive 下载…');driveProgress(10,'查找云端数据…');try{const f=await driveFindFile();if(!f){driveProgress(100,'没有云端文件');driveSetStatus('已连接 · 云端尚未创建同步文件','error');alert('Google Drive 中还没有健康同步文件，请先在一台设备点击“上传 / 同步”。');return}driveFileId=f.id;driveProgress(40,'下载健康数据…');const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(driveFileId)+'?alt=media',{interactive:true});const data=await r.json();if(data.schema!=='my-health-sync-v1'||!data.stores)throw new Error('云端文件格式不正确');const events=Array.isArray(data.stores.healthEvents)?data.stores.healthEvents:[],settings=Array.isArray(data.stores.settings)?data.stores.settings:[];if(!confirm(`云端有 ${events.length} 条健康记录。\n\n恢复后会覆盖本机当前健康记录和设置。\n\n确定继续吗？`))return;driveRestoring=true;driveProgress(65,'恢复本机数据…');const d=await openDB();for(const store of STORES){await new Promise((ok,no)=>{const tx=d.transaction(store,'readwrite');tx.objectStore(store).clear();tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});for(const v of (store==='healthEvents'?events:settings))await put(store,v)}driveRestoring=false;driveProgress(100,'恢复完成');driveSetStatus('已从 Google Drive 恢复','ok');alert('云端健康数据已恢复到本机');location.reload()}catch(e){driveRestoring=false;driveProgress(100,'恢复失败');driveSetStatus(e.message||String(e),'error');alert('Google Drive 恢复失败：'+(e.message||e))}finally{driveBusy=false}}
async function driveConnect(){try{driveSetStatus('正在连接 Google Drive…');await driveGetToken(true);const f=await driveFindFile();driveFileId=f?.id||null;localStorage.setItem('myHealth.driveConnected','1');driveSetStatus(f?'已连接 · 云端文件已关联':'已连接 · 云端尚未创建同步文件','ok')}catch(e){driveSetStatus('连接失败：'+(e.message||e),'error');alert('Google Drive 连接失败：'+(e.message||e))}}
function driveDisconnect(){driveToken=null;driveTokenExpiresAt=0;driveFileId=null;clearTimeout(driveAutoTimer);localStorage.removeItem('myHealth.driveConnected');driveSetStatus('未连接')}
function driveScheduleAutoSync(){if(driveRestoring||!document.getElementById('driveAutoSync')?.checked||!driveTokenValid())return;clearTimeout(driveAutoTimer);driveAutoTimer=setTimeout(()=>driveUpload(false,false),1200)}
function driveMarkLocalChange(){if(!driveRestoring)driveScheduleAutoSync()}
function driveBindUI(){const auto=document.getElementById('driveAutoSync');if(auto&&!auto.dataset.bound){auto.dataset.bound='1';auto.checked=localStorage.getItem(DRIVE_AUTO_KEY)==='1';auto.addEventListener('change',e=>{localStorage.setItem(DRIVE_AUTO_KEY,e.target.checked?'1':'0');if(e.target.checked)driveScheduleAutoSync()})}}
async function driveSilentRestore(){if(localStorage.getItem('myHealth.driveConnected')!=='1')return;try{await driveGetToken(false);const f=await driveFindFile();driveFileId=f?.id||null;driveSetStatus(f?'已连接 · 云端文件已关联':'已连接 · 云端尚未创建同步文件','ok')}catch(e){driveSetStatus('未连接 · 点击“连接 Google Drive”重新授权')}}
driveBindUI();
</script>
<script>
if("serviceWorker"in navigator){
 window.addEventListener("load",async()=>{
  try{
   const reg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
   reg.update();
   if(reg.waiting)reg.waiting.postMessage("SKIP_WAITING");
   reg.addEventListener("updatefound",()=>{
    const nw=reg.installing;if(!nw)return;
    nw.addEventListener("statechange",()=>{
     if(nw.state==="installed"&&navigator.serviceWorker.controller)nw.postMessage("SKIP_WAITING");
    });
   });
   let reloaded=false;
   navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!reloaded){reloaded=true;location.reload();}
   });
  }catch(e){console.error("Service Worker:",e)}
 });
}
</script>
<script>
function syncDietEnergyUnit(select){
 const f=select.closest("form")||select.parentElement;
 const i=f?.querySelector('input[name="calories"],input[name="kcal"],input[name="energy"],#dietCalories');
 if(!i)return;
 const old=select.dataset.unit||"kcal",v=Number(i.value);
 if(!Number.isFinite(v))return;
 const kcal=old==="kj"?v/4.184:v;
 i.value=select.value==="kj"?(kcal*4.184).toFixed(0):kcal.toFixed(1);
 select.dataset.unit=select.value;
}
document.addEventListener("change",e=>{if(e.target.id==="dietEnergyUnit")syncDietEnergyUnit(e.target)});
</script></body>
</html>
